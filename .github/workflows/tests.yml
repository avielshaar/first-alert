name: First-Alert CI

on:
  push:
    branches: ["main", "master", "beta"]
  pull_request:
    branches: ["main", "master", "beta"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Report dependency audit findings
        continue-on-error: true
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-full.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          function report(file) {
            const result = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, file), "utf8"));
            const vulnerabilities = Object.entries(result.vulnerabilities || {}).map(([name, item]) => ({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              advisories: (item.via || [])
                .filter(entry => typeof entry === "object")
                .map(entry => ({ title: entry.title, url: entry.url, range: entry.range })),
              fixAvailable: item.fixAvailable,
            }));
            console.log(JSON.stringify({
              report: file,
              totals: result.metadata && result.metadata.vulnerabilities,
              vulnerabilities,
            }, null, 2));
          }
          report("npm-audit-full.json");
          report("npm-audit-production.json");
          NODE

      - name: Check JavaScript syntax
        run: find src tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run Jest tests
        run: npm test

      - name: Build Docker image
        run: docker build --tag first-alert:ci .
