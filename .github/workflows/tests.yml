name: First-Alert CI

permissions:
  contents: write

on:
  push:
    branches: ["beta"]
  pull_request:
    branches: ["beta"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Reconcile dependency lockfile (temporary beta-only migration step)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run Jest tests
        run: npm test

      - name: Build Docker image
        run: docker build --tag first-alert:ci .

      - name: Commit lockfile reconciliation (beta only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync npm lockfile for Google GenAI SDK"
            git push origin HEAD:beta
          fi
