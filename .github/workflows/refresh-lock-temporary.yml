name: Refresh dependency lockfile (temporary)

on:
  push:
    branches: ["beta"]
    paths:
      - "package.json"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Regenerate lockfile from package.json overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Install resolved dependencies and apply local patches
        run: npm ci

      - name: Report dependency audit
        continue-on-error: true
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-full.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node <<'NODE'
          const fs = require("node:fs");
          for (const file of ["npm-audit-full.json", "npm-audit-production.json"]) {
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/" + file, "utf8"));
            console.log(JSON.stringify({
              report: file,
              totals: result.metadata && result.metadata.vulnerabilities,
              vulnerabilities: Object.entries(result.vulnerabilities || {}).map(([name, item]) => ({
                name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable
              }))
            }, null, 2));
          }
          NODE

      - name: Check JavaScript syntax
        run: find src tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run Jest tests
        run: npm test

      - name: Build Docker image
        run: docker build --tag first-alert:dependency-refresh .

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile did not change."
          else
            git commit -m "chore: refresh locked Puppeteer dependency tree"
            git push origin HEAD:beta
          fi
